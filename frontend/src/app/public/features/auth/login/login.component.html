<form class="card w-[400px]" [formGroup]="form" (submit)="submit()">
    <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Email" formControlName="email">
    </div>

    <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Password" formControlName="password">
    </div>

    <div class="flex justify-end">
        <button type="submit" [disabled]="!form.valid">Login</button>
    </div>

    <div class="text-center mt-4 text-gray-600">
        Don't have an account ? <a routerLink="/auth/register">Register</a>
    </div>

    <div class="text-center mt-4 text-gray-600">
        Forgot your password? <a routerLink="/auth/forgot-password">Reset</a>
    </div>

    {{ form.value | json }}
</form>
